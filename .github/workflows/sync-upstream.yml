name: Sync upstream piko

# Merges crimera/piko `dev` into a `sync/upstream` branch and opens (or refreshes) a PR into `main`.
# Release metadata (patches-bundle.json, patches-list.json) keeps our copy via .gitattributes.
#
# If the merge conflicts, the raw upstream branch is pushed as `upstream-dev` and the PR is opened
# from it instead, so GitHub shows the conflicts; resolve them locally:
#   git fetch origin && git switch main && git merge origin/upstream-dev
#
# Upstream commits often touch .github/workflows/ (dependabot). GITHUB_TOKEN may not push those,
# so set a SYNC_TOKEN secret: a fine-grained PAT for this repo with Contents, Pull requests and
# Workflows set to read/write. Without it the push step fails whenever upstream changed a workflow.

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/crimera/piko.git
  UPSTREAM_BRANCH: dev
  BASE: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.ours.driver true
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already contains upstream/$UPSTREAM_BRANCH."
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          behind=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          git switch -C sync/upstream
          if git merge --no-ff --no-edit -m "chore: Merge upstream crimera/piko $UPSTREAM_BRANCH" "upstream/$UPSTREAM_BRANCH"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push and open PR
        if: steps.merge.outputs.result == 'merged' || steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          RESULT: ${{ steps.merge.outputs.result }}
          BEHIND: ${{ steps.merge.outputs.behind }}
        run: |
          if [ "$RESULT" = merged ]; then
            head=sync/upstream
            git push --force origin sync/upstream
            body="Merges $BEHIND new commits from crimera/piko \`$UPSTREAM_BRANCH\`. Merged cleanly; build and check the extra patches before merging."
          else
            head=upstream-dev
            git push --force origin "upstream/$UPSTREAM_BRANCH:refs/heads/upstream-dev"
            body=$(printf '%s\n\n%s\n\n```\n%s\n```\n\n%s' \
              "crimera/piko \`$UPSTREAM_BRANCH\` has $BEHIND new commits that conflict with \`$BASE\`." \
              "Conflicting files:" "$(cat "$RUNNER_TEMP/conflicts.txt")" \
              "Resolve locally: \`git fetch origin && git switch $BASE && git merge origin/upstream-dev\`, then push and close this PR.")
          fi
          title="chore: Sync upstream piko ($BEHIND commits)"
          existing=$(gh pr list --base "$BASE" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName=="sync/upstream" or .headRefName=="upstream-dev") | .number' | head -1)
          if [ -n "$existing" ] && [ "$(gh pr view "$existing" --json headRefName --jq .headRefName)" = "$head" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            [ -n "$existing" ] && gh pr close "$existing" --comment "Superseded by a newer sync."
            gh pr create --base "$BASE" --head "$head" --title "$title" --body "$body"
          fi
